[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 88
# Ruff formats Python inside Markdown fences. The spec and the plan quote code
# for humans to read, and some fences are deliberately partial, so reformatting
# them is churn against prose rather than against source.
exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF",
]
ignore = [
  "E501", # long lines in translations/url strings; formatter handles the rest
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.post_at"]
combine-as-imports = true
